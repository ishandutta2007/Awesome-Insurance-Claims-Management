<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animations -->
    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: url(#title-grad);
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .wave-path {
        animation: wave 8s ease-in-out infinite alternate;
      }
      .float-node {
        animation: float 5s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.2; }
        100% { transform: scale(1.15); opacity: 0.6; }
      }
      @keyframes wave {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 200; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="1000" height="280" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Dynamic Background Geometric Elements (Behind Text) -->
  <g opacity="0.4">
    <!-- Pulsing Background Orb -->
    <circle cx="850" cy="140" r="120" fill="#6366f1" filter="url(#glow)" class="pulse-circle" />
    <circle cx="150" cy="220" r="90" fill="#0284c7" filter="url(#glow)" class="pulse-circle" />

    <!-- Claim Dynamic Flow Lines -->
    <path d="M 600 240 Q 720 180 840 220 T 960 140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" class="wave-path" />
    <path d="M 650 60 Q 780 120 880 80 T 980 180" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 4" class="wave-path" />
  </g>

  <!-- Interactive Graphic Nodes (Right Side Visual) -->
  <g transform="translate(680, 50)" class="float-node">
    <!-- Hub Card 1: FNOL Intake -->
    <rect x="40" y="30" width="110" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="95" y="56" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle">📥 FNOL Intake</text>

    <!-- Hub Card 2: Adjudication -->
    <rect x="180" y="70" width="125" height="42" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="242" y="96" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle">⚖️ Adjudication</text>

    <!-- Hub Card 3: Settlement -->
    <rect x="80" y="125" width="130" height="42" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="145" y="151" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle">💳 Settlement &amp; SIU</text>

    <!-- Connecting lines -->
    <line x1="150" y1="51" x2="180" y2="91" stroke="#475569" stroke-width="2" stroke-dasharray="4"/>
    <line x1="180" y1="112" x2="150" y2="125" stroke="#475569" stroke-width="2" stroke-dasharray="4"/>
  </g>

  <!-- Foreground Content Block (High Contrast & Clear) -->
  <g transform="translate(50, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 45)">
      <rect width="260" height="28" rx="14" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1"/>
      <text x="130" y="19" class="badge-text" text-anchor="middle">🛡️ INSURANCE TECH ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="122" class="title-text">Awesome Insurance Claims</text>
    <text x="0" y="165" class="title-text">Management 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="205" class="subtitle-text">Curated SaaS Platforms, Core Engines &amp; Open-Source Ecosystem</text>
    <text x="0" y="228" class="subtitle-text" font-size="14" fill="#64748b">FNOL • Claims Adjudication • Reserving • Fraud Detection • Payments</text>
  </g>
</svg>
